name: Atualizar cartões do README

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 06:17 no horário de Brasília
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - scripts/**
      - fonts/**
      - data/portrait.txt
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install fonttools brotli

      - name: Buscar dados do GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Desenhar os cartões
        run: python scripts/render_cards.py

      - name: Salvar os cartões
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data README.md
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Atualiza cartões do README"
          git push
